<section class="profile-page">
  <div class="profile-header">
    <span class="eyebrow">Mi cuenta</span>
    <h1>Perfil</h1>
    <p>Actualizá tus datos de contacto desde un único espacio.</p>
  </div>

  <div class="profile-grid" *ngIf="!loading; else loadingState">
    <mat-card>
      <mat-card-header>
        <mat-card-title>Datos personales</mat-card-title>
        <mat-card-subtitle>Información visible en tu cuenta</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <form [formGroup]="profileForm" class="profile-form">
          <mat-form-field appearance="outline">
            <mat-label>Nombre</mat-label>
            <input matInput formControlName="name" />
            <mat-error *ngIf="profileForm.get('name')?.hasError('required')">El nombre es obligatorio.</mat-error>
            <mat-error *ngIf="profileForm.get('name')?.hasError('minlength')">Ingresá al menos 3 caracteres.</mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Email</mat-label>
            <input matInput formControlName="email" />
            <mat-error *ngIf="profileForm.get('email')?.hasError('required')">El email es obligatorio.</mat-error>
            <mat-error *ngIf="profileForm.get('email')?.hasError('email')">Ingresá un email válido.</mat-error>
          </mat-form-field>
        </form>
      </mat-card-content>

      <mat-card-actions align="end">
        <button mat-flat-button color="primary" type="button" [disabled]="profileForm.invalid || savingProfile" (click)="saveProfile()">
          {{ savingProfile ? 'Guardando...' : 'Guardar perfil' }}
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</section>

<ng-template #loadingState>
  <div class="loading-shell">
    <div class="skeleton-card"></div>
  </div>
</ng-template>
