<div style="max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px;">
  <h2>Login</h2>

  <div *ngIf="error" style="color: red; margin-bottom: 15px;">
    {{ error }}
  </div>

  <div style="margin-bottom: 15px;">
    <label for="email">Email:</label>
    <input
      id="email"
      type="email"
      [(ngModel)]="email"
      placeholder="tu@email.com"
      style="width: 100%; padding: 8px; box-sizing: border-box;"
    />
  </div>

  <div style="margin-bottom: 15px;">
    <label for="password">Contraseña:</label>
    <input
      id="password"
      type="password"
      [(ngModel)]="password"
      placeholder="tu contraseña"
      style="width: 100%; padding: 8px; box-sizing: border-box;"
    />
  </div>

  <button
    (click)="login()"
    [disabled]="loading"
    style="width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer;"
  >
    {{ loading ? 'Cargando...' : 'Login' }}
  </button>
</div>
