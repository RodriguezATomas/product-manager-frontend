<div class="app-shell">
  <header class="app-navbar" *ngIf="showNavbar">
    <a class="brand-link" routerLink="/profile">Project Manager</a>

    <nav class="nav-links" aria-label="Navegacion principal">
      <a class="nav-link" routerLink="/profile" routerLinkActive="nav-link-active">
        Perfil
      </a>
      <a
        *ngIf="authService.isAdmin()"
        class="nav-link"
        routerLink="/users"
        routerLinkActive="nav-link-active">
        Usuarios
      </a>
      <a
        *ngIf="authService.isAdmin()"
        class="nav-link"
        routerLink="/products"
        routerLinkActive="nav-link-active">
        Productos
      </a>
    </nav>

    <button class="logout-button" type="button" (click)="logout()">
      <mat-icon>logout</mat-icon>
      Cerrar sesion
    </button>
  </header>

  <main class="app-content" [class.app-content-with-navbar]="showNavbar">
    <router-outlet></router-outlet>
  </main>
</div>
