<section class="dashboard-layout">
  <aside class="dashboard-sidebar">
    <div class="sidebar-brand">
      <img src="assets/images/logo.png" alt="e-Sueldos" class="sidebar-logo" />
    </div>

    <nav class="sidebar-nav">
      <a [routerLink]="userHomeRoute" routerLinkActive="is-active" class="sidebar-link" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon>home</mat-icon>
        <span>Inicio</span>
      </a>

      <a routerLink="/products" routerLinkActive="is-active" class="sidebar-link" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon>inventory_2</mat-icon>
        <span>Productos</span>
      </a>

      <a routerLink="/repairs" routerLinkActive="is-active" class="sidebar-link" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon>build</mat-icon>
        <span>Reparaciones</span>
      </a>

      <a routerLink="/products/build-pc" routerLinkActive="is-active" class="sidebar-link">
        <mat-icon>memory</mat-icon>
        <span>Arma tu PC</span>
      </a>

      <a routerLink="/products/orders" routerLinkActive="is-active" class="sidebar-link">
        <mat-icon>receipt_long</mat-icon>
        <span>Mis pedidos</span>
      </a>

      <a routerLink="/profile" routerLinkActive="is-active" class="sidebar-link">
        <mat-icon>account_circle</mat-icon>
        <span>Perfil</span>
      </a>
    </nav>

    <div class="sidebar-user">
      <div class="sidebar-user-avatar">
        {{ currentUserName.charAt(0) }}
      </div>

      <div class="sidebar-user-info">
        <strong>{{ currentUserName }}</strong>
        <span>{{ currentUserRoleLabel }}</span>
      </div>
    </div>
  </aside>

  <main class="dashboard-main">
    <header class="dashboard-header">
      <div class="dashboard-header-copy">
        <h1 *ngIf="pageTitle">{{ pageTitle }}</h1>
      </div>

      <div class="dashboard-header-actions">
        <button mat-stroked-button type="button" (click)="logout()">
          Salir
        </button>
      </div>
    </header>

    <router-outlet></router-outlet>
  </main>
</section>
