<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions-row">
  <button mat-stroked-button type="button" class="dialog-secondary-button" [mat-dialog-close]="false">Cancelar</button>
  <button mat-flat-button type="button" class="dialog-danger-button" [mat-dialog-close]="true">Eliminar</button>
</mat-dialog-actions>
